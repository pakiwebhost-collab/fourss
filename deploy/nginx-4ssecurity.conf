# Nginx reverse proxy for 4ssecurity.pk -> Next.js on port 3000.
# Copy to /etc/nginx/sites-available/4ssecurity and symlink into sites-enabled,
# then run: sudo certbot --nginx -d 4ssecurity.pk -d www.4ssecurity.pk

server {
    listen 80;
    server_name 4ssecurity.pk www.4ssecurity.pk;

    # Redirect www to the bare domain
    if ($host = www.4ssecurity.pk) {
        return 301 https://4ssecurity.pk$request_uri;
    }

    client_max_body_size 30M;   # media uploads up to 25 MB

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
